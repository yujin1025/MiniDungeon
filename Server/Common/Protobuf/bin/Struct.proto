syntax = "proto3";
package Protocol;

import "Enum.proto";

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
	CreatureType creature_type = 4;
	// ...
}

message PlayerInfo
{
	uint64 player_id = 1;
	PlayerType player_type = 2;
	string player_name = 3;
	ObjectInfo object_info = 4;
	// ...
}

message RoomInfo
{
	uint64 room_id = 1;
	PlayerInfo host = 2;
	string room_name = 3;
	string password = 4;
	uint32 current_player_count = 5;
	repeated PlayerInfo players = 6;
	// ...
}

message AttackInfo
{
	uint64 object_id = 1;
	float damage = 2;
	uint64 attack_type = 3;
	bool ishit = 4;
}

message MonsterInfo
{
	ObjectInfo object_info = 1;
	ObjectType object_type = 2;
	AttackInfo attack_info = 3;
	uint32 targetplayer_id = 4;
	uint32 monster_hp = 5;
	uint32 speed = 6;
	uint32 damage = 7;
	PosInfo pos_info = 8;
	bool isfindplayer = 9;
	float calcdist = 10;
}