syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message CTS_EMAIL_VERIFICATION
{
	string email = 1;
}

message STC_EMAIL_VERIFICATION
{
	bool success = 1;
}

message CTS_AUTH
{
	string email = 1;
	string auth_code = 2;
}

message STC_AUTH
{
	bool success = 1;
}

message CTS_CHECK_DUPLICATE
{
	string id = 1;
}

message STC_CHECK_DUPLICATE
{
	bool is_duplicate = 1;
}

message CTS_REGISTER
{
	string id = 1;
	string pw = 2;
	string email = 3;
}

message STC_REGISTER
{
	bool success = 1;
}

message CTS_LOGIN
{
	string id = 1;
	string pw = 2;
}

message STC_LOGIN
{
	bool success = 1;
	PlayerInfo player = 2;
}

message CTS_ENTER_LOBBY
{
	PlayerInfo player = 1;
}

message STC_ENTER_LOBBY
{
	bool success = 1;
	PlayerInfo player = 2;
	repeated RoomInfo rooms = 3;
}

message CTS_CREATE_ROOM
{
	RoomInfo room_info = 1;
}

message STC_CREATE_ROOM
{
	bool success = 1;
	RoomInfo room_info = 2;
}

message CTS_JOIN_ROOM
{
	uint64 roomIndex = 1;
	string password = 2;
	PlayerInfo player = 3;
}

message STC_JOIN_ROOM
{
	bool success = 1;
	RoomInfo room_info = 2;
	PlayerInfo player = 3;
}

message CTS_CHANGE_CHARACTER
{
	uint64 roomIndex = 1;
	uint64 player_id = 2;
	PlayerType character = 3;
}

message STC_CHANGE_CHARACTER
{
	bool success = 1;
	uint64 roomIndex = 2;
	uint64 player_id = 3;
	PlayerType character = 4;
}

message CTS_LEAVE_ROOM
{
	uint64 roomIndex = 1;
	uint64 player_id = 2;
}

message STC_LEAVE_ROOM
{
	bool success = 1;
	RoomInfo room_info = 2;
	uint64 player_id = 3;
	repeated RoomInfo rooms = 4;
}

message CTS_ENTER_GAME
{
	uint64 room_id = 1;
}

message STC_ENTER_GAME
{
	bool success = 1;
	repeated PlayerInfo players = 2;
	repeated MonsterInfo monsters = 3;
}

message CTS_LEAVE_GAME
{

}

message STC_LEAVE_GAME
{

}

message CTS_SPAWN
{
	uint64 room_id = 1;
	CreatureType creature_type = 2;
	PosInfo pos_info = 3;
}

message STC_SPAWN_BOSS
{
	MonsterInfo monsters = 1;
}

message STC_SPAWN
{
	ObjectInfo object_info = 1;
}

message STC_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message CTS_MOVE
{
	PosInfo info = 1;
}

message STC_MOVE
{
	PosInfo info = 1;
	uint64 target_object_id = 2;
}

message CTS_MONSTER_ATTACK
{
	uint64 monster_id = 1;
	uint64 monster_attack_type = 2;
}

message STC_MONSTER_ATTACK
{
	uint64 monster_id = 1;
	uint64 monster_attack_type = 2;
	repeated AttackedInfo attacked_infos = 3;
}

message STC_ATTACKED
{
	uint64 attacking_object_id = 1;
	PlayerType attacking_player_type = 2;
	uint64 attacking_skill_type = 3;
	repeated AttackedInfo attacked_infos = 4;
}

message CTS_MONSTER_CLEARED
{
	bool isCleared = 1;
}

message CTS_ATTACK
{
	AttackInfo info = 1;
}

message STC_ATTACK
{
	AttackInfo info = 1;
}
